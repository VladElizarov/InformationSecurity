name: Security Scan

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lab1

jobs:
  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Bandit report
        if: always()
        run: |
          bandit -r . --exclude ./.venv -f json -o bandit-report.json --exit-zero
          {
            echo '## SAST — Bandit'
            echo '```'
            bandit -r . --exclude ./.venv --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bandit check (fails on Medium/High)
        run: bandit -r . --exclude ./.venv --severity-level medium

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: lab1/bandit-report.json
          if-no-files-found: warn

  sca-pip-audit:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: pip-audit report
        if: always()
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
          {
            echo '## SCA — pip-audit'
            echo '```'
            pip-audit -r requirements.txt --desc || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: pip-audit check (fails on known vulnerabilities)
        run: pip-audit -r requirements.txt --strict

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: lab1/pip-audit-report.json
          if-no-files-found: warn
